services:
  shopflow-postgres:
    image: postgres:17-alpine
    container_name: shopflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: shopflow
      POSTGRES_USER: shopflow_user
      POSTGRES_PASSWORD: shopflow_local_only

    ports:
      - "5433:5432"

    volumes:
      - shopflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow_user -d shopflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  shopflow-postgres-replica:
    image: postgres:17-alpine
    container_name: shopflow-postgres-replica
    profiles: ["replica"]
    restart: unless-stopped
    depends_on:
      shopflow-postgres:
        condition: service_healthy

    environment:
      POSTGRES_DB: shopflow
      POSTGRES_USER: shopflow_user
      POSTGRES_PASSWORD: shopflow_local_only
      PRIMARY_HOST: shopflow-postgres
      REPLICATION_USER: shopflow_replicator
      REPLICATION_PASSWORD: shopflow_replica_local_only

    ports:
      - "5435:5432"

    volumes:
      - shopflow_postgres_replica_data:/var/lib/postgresql/data
      - ../Sipe_Olaoluwa_301911387_Portfolio5_DistributedDatabases/Sipe_Olaoluwa_301911387_Portfolio5_DistributedDatabases_replica_entrypoint.sh:/replica-entrypoint.sh:ro

    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow_user -d shopflow"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  shopflow-mongo:
    image: mongo:7
    container_name: shopflow-mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - shopflow_mongo_data:/data/db

volumes:
  shopflow_postgres_data:
  shopflow_postgres_replica_data:
  shopflow_mongo_data: